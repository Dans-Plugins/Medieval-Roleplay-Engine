name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    # A release published with a .jar already attached was produced by the release automation,
    # which attaches the exact JAR that passed verification. Rebuilding here would attach a second,
    # unverified JAR — and Dan's Plugin Manager installs the first .jar asset it finds.
    if: ${{ !contains(join(github.event.release.assets.*.name, ','), '.jar') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package --batch-mode

      - name: Determine release JAR
        id: determine_jar
        run: |
          JAR_PATH=$(ls target/*.jar 2>/dev/null | grep -v 'original-' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No suitable release JAR found in target/." >&2
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload JAR to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.determine_jar.outputs.jar_path }}
