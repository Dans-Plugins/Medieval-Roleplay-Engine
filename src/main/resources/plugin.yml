name: MedievalRoleplayEngine
version: '${project.version}'
author: DanTheTechMan
main: dansplugins.rpsystem.MedievalRoleplayEngine
api-version: "1.13"
softdepend: [PlaceholderAPI, MedievalFactions, Mailboxes]

commands:
  card:
  bird:
  local:
  rp:
  global:
  ooc:
  emote:
  me:
  roll:
    description: Roll a die. Defaults to a d20 if no max is specified.
    usage: /roll [max]
  dice:
    description: Roll a die. Defaults to a d20 if no max is specified.
    usage: /dice [max]
  title:
  yell:
  whisper:
  rphelp:
  rpconfig:
  lo:

permissions:
  rp.bird:
    default: true
  rp.card.show:
    default: true
  rp.card.lookup:
    default: true
  rp.card.help:
    default: true
  rp.card.name:
    default: true
  rp.card.race:
    default: true
  rp.card.subculture:
    default: true
  rp.card.religion:
    default: true
  rp.card.age:
    default: true
  rp.card.gender:
    default: true
  rp.local:
    default: true
  rp.rp:
    default: true
  rp.global:
    default: true
  rp.ooc:
    default: true
  rp.emote:
    default: true
  rp.me:
    default: true
  rp.roll:
    default: true
  rp.dice:
    default: true
  rp.title:
    default: true
  rp.yell:
    default: true
  rp.whisper:
    default: true
  rp.help:
    default: true
  rp.localOOC:
    default: true
  rp.card.forcesave:
    default: op
  rp.card.forceload:
    default: op
  rp.config:
    default: op
  # Accepted as an alternative to each of the card nodes below wherever they are checked.
  # rp.card.forcesave and rp.card.forceload are deliberately excluded: neither is gated on
  # this node in code, so listing them here would grant more than the checks ever consult.
  rp.card.*:
    default: op
    children:
      rp.card.show: true
      rp.card.lookup: true
      rp.card.help: true
      rp.card.name: true
      rp.card.race: true
      rp.card.subculture: true
      rp.card.religion: true
      rp.card.age: true
      rp.card.gender: true